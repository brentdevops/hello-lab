# CI (GitOps): build the image, TEST that it starts, push it to GHCR, write the new tag into git.
# CI never touches the cluster. Argo CD sees the git change and deploys it.
name: ci

on:
  push:
    branches: [main]
    paths: ["app.py", "Dockerfile", ".github/workflows/ci.yml"]
  workflow_dispatch: {}

permissions:
  contents: write # push the tag-bump commit
  packages: write # push the image to GHCR

concurrency:
  group: ci
  cancel-in-progress: false

jobs:
  build-and-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set the image tag (short commit SHA)
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # QEMU + buildx = build for Intel/AMD servers AND ARM (your Mac) in one go
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # SAFETY CHECK (OPS-219): build a test copy and actually START it.
      # If the app doesn't answer /health, CI stops here: nothing is pushed, nothing deploys.
      - name: Build a test copy
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hello-lab:test
          build-args: VERSION=test

      - name: Smoke test (start the app, call /health)
        run: |
          docker run -d --name smoke -p 8080:8080 hello-lab:test
          for i in $(seq 1 10); do
            if curl -fsS localhost:8080/health; then
              echo "PASSED: the app started and answered /health"
              exit 0
            fi
            sleep 2
          done
          echo "FAILED: the app never answered /health. Its logs:"
          docker logs smoke
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: ghcr.io/brentdevops/hello-lab:${{ env.TAG }}

      - name: Write the new tag into git (Argo CD deploys it)
        run: |
          sed -i "s/^  tag: .*/  tag: \"${TAG}\"/" hello-chart/values-dev.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hello-chart/values-dev.yaml
          git commit -m "ci: deploy ${TAG} to dev"
          git push
