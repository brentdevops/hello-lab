# DEPLOY: runs when code lands on main (a merged PR or a direct push), or by hand.
#
#   infra  → terraform apply        (server, ECR, firewall exist and match the code)
#   build  → build, scan, push image (tag = commit ID)
#   deploy → apply k8s files on the server via SSM, wait for rollout, smoke test
#
# Repo variables used (Settings → Secrets and variables → Actions → Variables):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, MY_IP_CIDR
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"] # editing docs doesn't redeploy
  workflow_dispatch: {} # "Run workflow" button: brings everything up from nothing

# Only one deploy at a time. A second one waits instead of fighting over the same server/state.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # lets the job ask GitHub for an OIDC token, which AWS trades for temp creds
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VERSION: 1.14.7
  TF_VAR_my_ip_cidr: ${{ vars.MY_IP_CIDR }} # TF_VAR_<name> = how CI fills a Terraform variable

jobs:
  infra:
    runs-on: ubuntu-latest
    outputs:
      ecr_repo_url: ${{ steps.out.outputs.ecr_repo_url }}
      instance_id: ${{ steps.out.outputs.instance_id }}
      app_url: ${{ steps.out.outputs.app_url }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # the wrapper adds extra text to output, which breaks `output -raw`

      - run: terraform init -input=false
      - run: terraform apply -auto-approve -input=false

      - name: Pass Terraform outputs to the next jobs
        id: out
        run: |
          {
            echo "ecr_repo_url=$(terraform output -raw ecr_repo_url)"
            echo "instance_id=$(terraform output -raw instance_id)"
            echo "app_url=$(terraform output -raw app_url)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: infra
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.infra.outputs.ecr_repo_url }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # ECR tags are immutable: re-running for the same commit would fail on push, so skip
      - name: Skip if this commit's image is already in ECR
        id: exists
        run: |
          if aws ecr describe-images --repository-name hello-lab \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "image already pushed, skipping build"
          fi

      - name: Build
        if: steps.exists.outputs.skip != 'true'
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" -t "$IMAGE" .

      - name: Scan (fail on fixable HIGH/CRITICAL)
        if: steps.exists.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push
        if: steps.exists.outputs.skip != 'true'
        run: docker push "$IMAGE"

  deploy:
    needs: [infra, build]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.infra.outputs.ecr_repo_url }}:${{ github.sha }}
      INSTANCE_ID: ${{ needs.infra.outputs.instance_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # A brand-new server needs ~1-2 min before AWS can send it commands.
      - name: Wait for the server to be reachable via SSM
        run: |
          for i in $(seq 1 60); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            echo "attempt $i: SSM status = $STATUS"
            [ "$STATUS" = "Online" ] && exit 0
            sleep 10
          done
          echo "server never came online in SSM" && exit 1

      # GitHub's machines can't reach the server (firewall = your IP only).
      # So AWS SSM carries the k8s files TO the server, and kubectl runs ON the server.
      - name: Deploy via SSM
        run: |
          set -euo pipefail

          # 1. fill the image into the Deployment, bundle it with the Service
          sed "s|IMAGE|$IMAGE|" k8s/deployment.yaml >  manifests.yaml
          echo "---"                                >> manifests.yaml
          cat k8s/service.yaml                      >> manifests.yaml
          B64=$(base64 -w0 manifests.yaml) # one safe line of text, no quoting problems

          # 2. the commands the server will run (as root, via SSM)
          jq -n --arg b64 "$B64" '{
            executionTimeout: ["600"],
            commands: [
              "set -e",
              "K=/usr/local/bin/k3s",
              "for i in $(seq 1 60); do $K kubectl get nodes 2>/dev/null | grep -q \" Ready\" && break; echo waiting for k3s; sleep 5; done",
              ("echo " + $b64 + " | base64 -d | $K kubectl apply -f -"),
              "$K kubectl rollout status deployment/hello --timeout=180s",
              "echo SMOKE TEST:; curl -fsS --retry 5 --retry-delay 2 http://$($K kubectl get svc hello -o jsonpath={.spec.clusterIP})/"
            ]}' > params.json

          # 3. send them, then poll until they finish
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          echo "===== output from the server ====="
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Summary
        run: |
          echo "### Deployed ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "App: ${{ needs.infra.outputs.app_url }} (reachable from MY_IP_CIDR only)" >> "$GITHUB_STEP_SUMMARY"
