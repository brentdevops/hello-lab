apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  type: NodePort
  selector:
    app: hello            # must match the pod label in deployment.yaml, or endpoints = empty
  ports:
    - port: 80            # Service port inside the cluster
      targetPort: 8080    # container port
      nodePort: 30080     # port on the EC2 node (open to your IP in the security group)
